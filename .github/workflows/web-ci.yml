name: Web CI

on:
  push:
    paths:
      - "web/**"
      - "cmd/yamlfixture/**"
      - "internal/review/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "cmd/yamlfixture/**"
      - "internal/review/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roundtrip:
    name: YAML round-trip PoC
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Regenerate YAML fixtures (Go side)
        run: make web-fixtures

      # The fixtures live in web/fixtures/. They are tracked in git so a stale
      # generator immediately fails the next step.
      - name: Fail if fixtures drifted
        run: git diff --exit-code -- web/fixtures

      - name: Kotlin round-trip test
        working-directory: web
        run: ./gradlew --no-daemon test
