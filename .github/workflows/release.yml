name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Build cross-platform binaries
        run: make build-all

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum sitatame-darwin-amd64 sitatame-darwin-arm64 \
                    sitatame-linux-amd64 sitatame-linux-arm64 \
            > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/sitatame-darwin-amd64
            dist/sitatame-darwin-arm64
            dist/sitatame-linux-amd64
            dist/sitatame-linux-arm64
            dist/checksums.txt
